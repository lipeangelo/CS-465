
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Add New Trip</h4>
    </div>
  
    <div class="card-body">
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>
  
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>
  
      <form #tripForm="ngForm" (ngSubmit)="addTrip()">
  
        <div class="mb-3">
          <label for="code" class="form-label">Trip Code</label>
          <input type="text" id="code" name="code"
                 class="form-control" [(ngModel)]="trip.code" required>
        </div>
  
        <div class="mb-3">
          <label for="name" class="form-label">Trip Name</label>
          <input type="text" id="name" name="name"
                 class="form-control" [(ngModel)]="trip.name" required>
        </div>
  
        <div class="mb-3">
          <label for="length" class="form-label">Trip Length</label>
          <input type="text" id="length" name="length"
                 class="form-control" [(ngModel)]="trip.length" required
                 placeholder="4 nights / 5 days">
        </div>
  
        <div class="mb-3">
          <label for="start" class="form-label">Start Date</label>
          <input type="date" id="start" name="start"
                 class="form-control" [(ngModel)]="trip.start" required>
        </div>
  
        <div class="mb-3">
          <label for="resort" class="form-label">Resort</label>
          <input type="text" id="resort" name="resort"
                 class="form-control" [(ngModel)]="trip.resort" required>
        </div>
  
        <div class="mb-3">
          <label for="perPerson" class="form-label">Price Per Person</label>
          <input type="number" id="perPerson" name="perPerson"
                 class="form-control" [(ngModel)]="trip.perPerson"
                 min="0" step="0.01" required>
        </div>
  
        <div class="mb-3">
          <label for="image" class="form-label">Image Filename</label>
          <input type="text" id="image" name="image"
                 class="form-control" [(ngModel)]="trip.image"
                 placeholder="reef1.jpg" required>
        </div>
  
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" name="description"
                    class="form-control" rows="4"
                    [(ngModel)]="trip.description" required></textarea>
        </div>
  
        <button type="submit" class="btn btn-primary"
                [disabled]="tripForm.invalid || isSaving">
          {{ isSaving ? 'Saving...' : 'Add Trip' }}
        </button>
  
      </form>
    </div>
  </div>
